[workspace]
resolver = "2"
members = [
    "crates/daemon",
    "crates/shared",
    "crates/swupdate-sys",
    "crates/iap2",
    "crates/iap2-macros",
    "crates/iap2-mfi",
    "tools/codegen",
]

[workspace.package]
edition = "2021"
version = "2.1.0"
rust-version = "1.87"
license = "GPL-3.0-only"
authors = ["Nocturne Team"]
homepage = "https://usenocturne.com"

[workspace.dependencies]
tokio = { version = "1.41" }
bluer = { version = "0.17" }
iap2-rs = { path = "crates/iap2" }
bytes = "1.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
serde = { version = "=1.0.228" }
serde_json = "1.0"
rmp-serde = "1.3"
rmpv = "1.3"
hex = "0.4"
base64 = "0.22"
uuid = "1.11"
futures = "0.3"
libc = "0.2"
dbus = "0.9"
dbus-crossroads = "0.5.2"
dbus-tokio = "0.7"
tokio-tungstenite = "0.24"
tungstenite = "0.24"
async-trait = "0.1"
crc32fast = "1.5.0"
md5 = "0.7"
opus = "0.3"
tract-ndarray = { package = "ndarray", version = "0.16.1" }
tract-onnx = "0.21"
axum = "0.8"
tower-http = { version = "0.6" }
async-stream = "0.3"
ts-rs = "=12.0.1"
typeshare = "=1.0.5"
serde_with = "=3.17.0"
derive_more = "=2.1.1"
tokio-util = "=0.7.18"
flate2 = "=1.1.9"
bindgen = "=0.72.1"
pkg-config = "=0.3.32"
cc = "=1.2.45"
sha2 = "0.10"
tempfile = "3.14"
filetime = "0.2"
zstd = "0.13"
tar = "0.4"

[profile.release]
lto = true
strip = "symbols"
