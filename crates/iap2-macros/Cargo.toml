[package]
name = "iap2-macros"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc macros for iap2-rs. Forked from bridgething/crates/macros (MIT, Joey Eamigh)."

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "parsing"] }
