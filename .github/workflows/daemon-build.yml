name: Daemon

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Cross.toml"
      - ".github/workflows/daemon-build.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Cross.toml"
      - ".github/workflows/daemon-build.yml"
  release:
    types: [created]

jobs:
  build:
    name: Build (aarch64 + --features device)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build nocturned
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: aarch64-unknown-linux-gnu
          args: "--release --features device -p nocturned"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturned
          path: target/aarch64-unknown-linux-gnu/release/nocturned
          compression-level: 9
          if-no-files-found: error

      - name: Upload build artifact to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/aarch64-unknown-linux-gnu/release/nocturned
