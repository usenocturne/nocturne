require conf/distro/superbird.conf

DISTRO = "nocturne"
DISTRO_NAME = "Nocturne"
DISTRO_VERSION = "4.1.0"
MAINTAINER = "Nocturne Team <hello@usenocturne.com>"

# Production is fail-closed: SWUpdate verifies signed containers and the SWU
# recipes require a secret-mounted matching private key. Local unsigned images
# require the explicit development-unsigned mode.
NOCTURNE_SWUPDATE_SIGNING_MODE ?= "production"
NOCTURNE_SWUPDATE_PRIVATE_KEY ?= ""
NOCTURNE_BUILD_ID ?= "${DATETIME}"
INHERIT += "nocturne-build-id"

SUPERBIRD_HOSTNAME = "nocturne"
SUPERBIRD_MDNS_SERVICE_NAME = "Nocturne"
SUPERBIRD_USB_GADGET_NAME = "nocturne"
SUPERBIRD_USB_GADGET_MANUFACTURER = "Vanta Labs"
SUPERBIRD_USB_GADGET_PRODUCT = "Nocturne"
SUPERBIRD_DESCRIPTION = "The most advanced custom firmware for the Spotify Car Thing."
SUPERBIRD_BOOT_LOGO_NAME = "nocturne-bootup.bmp"
SUPERBIRD_WESTON_SPLASH_IMAGE = "nocturne-splash.png"

CHROMIUM_KIOSK_URL = "http://127.0.0.1:8080/"

# SWUpdate delta URLs are consumed by nocturned's Unix-socket delta source.
SUPERBIRD_OTA_DELTA_URL_BASE = "nocturne:/"
