# SWUpdate runtime configuration. Keep this as libconfig syntax at the default
# /etc/swupdate.cfg path. Files under /etc/swupdate/conf.d are sourced as shell.
globals:
{
    bootloader = "uboot";
    public-key-file = "/etc/nocturne.pem";
    syslog = true;
};

uboot:
{
    fwenv = "/etc/fw_env.config";
};
