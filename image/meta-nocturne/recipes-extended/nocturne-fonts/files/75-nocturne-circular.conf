<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Spotify's script-specific Circular files have no usable family name.
    Register them under the Latin family's real typographic name so Blink can
    select the appropriate glyph coverage from the same CSS family.
  -->
  <match target="scan">
    <test name="file" compare="contains">
      <string>CircularSp-Arab-</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Circular Sp UI v3 T</string>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>CircularSp-Cyrl-</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Circular Sp UI v3 T</string>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>CircularSp-Deva-</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Circular Sp UI v3 T</string>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>CircularSp-Grek-</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Circular Sp UI v3 T</string>
    </edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains">
      <string>CircularSp-Hebr-</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Circular Sp UI v3 T</string>
    </edit>
  </match>
</fontconfig>
