# Nocturne directory layout.
#
# /var/nocturne/                  user-installable webapp bundles on data partition.
# /var/lib/nocturne/state/        persistent daemon state DB on settings partition.
#                                 Settings is shared between system_a and system_b so
#                                 paired devices, last-active webapp, and the
#                                 kv-storage map survive bootslot swaps + OTA upgrades.

d /var/nocturne                 0755 root root - -
d /var/nocturne/webapps         0755 root root - -
d /var/lib/nocturne             0755 root root - -
d /var/lib/nocturne/state       0755 root root - -
