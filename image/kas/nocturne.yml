header:
  version: 18
  includes:
    - repo: yocto-superbird
      file: kas/superbird.yml

distro: nocturne

env:
  NOCTURNE_BUILD_ID: null
  NOCTURNE_SWUPDATE_SIGNING_MODE: null
  NOCTURNE_SWUPDATE_PRIVATE_KEY: null

target:
  - nocturne-dev-image
  - nocturne-update-dev
  - nocturne-update-dev-delta
  - nocturne-prod-image
  - nocturne-update-prod
  - nocturne-update-prod-delta

repos:
  yocto-superbird:
    url: https://github.com/JoeyEamigh/yocto-superbird.git
    commit: 8f9abf2dbc99c38f43d216cf453af31c705eaccd
    path: sources/yocto-superbird
    layers:
      meta-superbird:

  meta-nocturne:
    path: .
    layers:
      meta-nocturne:
