header:
  version: 18
  includes:
    - repo: yocto-superbird
      file: kas/superbird.yml

distro: nocturne

local_conf_header:
  cache: |
    SSTATE_MIRRORS = "file://.* https://sstate.bridgething.com/sstate/PATH;downloadfilename=PATH \n file://.* http://sstate.yoctoproject.org/all/PATH;downloadfilename=PATH"
    PREMIRRORS ?= "https?$://.*/.* http://sources.openembedded.org/ \n git://.*/.* http://sources.openembedded.org/ \n"
    BB_GENERATE_MIRROR_TARBALLS = "1"
  hashequiv: |
    BB_SIGNATURE_HANDLER = "OEEquivHash"
    BB_HASHSERVE = "auto"
    BB_HASHSERVE_UPSTREAM = "wss://hashserv.bridgething.com/ws"

env:
  NOCTURNE_BUILD_ID: null
  NOCTURNE_SWUPDATE_SIGNING_MODE: null
  NOCTURNE_SWUPDATE_PRIVATE_KEY: null

target:
  - nocturne-dev-image
  - nocturne-update-dev
  - nocturne-update-dev-delta
  - nocturne-prod-image
  - nocturne-update-prod
  - nocturne-update-prod-delta

repos:
  yocto-superbird:
    url: https://github.com/JoeyEamigh/yocto-superbird.git
    commit: c1576ad54d6a7520a6de5591ee08e58724f8077b
    path: sources/yocto-superbird
    layers:
      meta-superbird:

  meta-nocturne:
    path: .
    layers:
      meta-nocturne:
