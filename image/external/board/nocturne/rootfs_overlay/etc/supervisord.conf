[unix_http_server]
file = /var/run/supervisor.sock

[supervisord]
logfile = /var/log/supervisor/supervisord.log
logfile_maxbytes = 200KB
logfile_backups = 1
pidfile = /var/run/supervisord.pid
childlogdir = /var/log/supervisor

[program:backlight]
command=sp-als-backlight
numprocs=1
autorestart=true
autostart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/backlight.info
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
stdout_capture_maxbytes=1MB
stdout_events_enabled=false
stderr_logfile=/var/log/backlight.err
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=3
stderr_capture_maxbytes=1MB
stderr_events_enabled=false

[program:nocturned]
command=/usr/bin/nocturned
numprocs=1
autorestart=true
autostart=true
startsecs=0
priority=90
redirect_stderr=false
environment=RUST_LOG="nocturned=info,iap2_rs=info,bluer=info"
stdout_logfile=/var/log/nocturned.info
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
stdout_capture_maxbytes=1MB
stdout_events_enabled=false
stderr_logfile=/var/log/nocturned.err
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=3
stderr_capture_maxbytes=1MB
stderr_events_enabled=false

[program:nocturne-ui]
command=/usr/bin/static-web-server --host 127.0.0.1 --port 80 --root /etc/nocturne/ui --compression false
numprocs=1
autorestart=true
autostart=true
startsecs=0
priority=95
redirect_stderr=false
stdout_logfile=/var/log/nocturne-ui.info
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
stdout_capture_maxbytes=1MB
stdout_events_enabled=false
stderr_logfile=/var/log/nocturne-ui.err
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=3
stderr_capture_maxbytes=1MB
stderr_events_enabled=false

[program:chromium]
command=/usr/bin/chromium-browser/chrome --no-sandbox --in-process-gpu --remote-debugging-port=2222 --user-data-dir=/var/lib/chrome_storage --kiosk --disable-pinch --allow-file-access-from-files --ignore-certificate-errors --enable-experimental-web-platform-features --app=http://localhost:80
numprocs=1
autorestart=true
autostart=true
startsecs=0
priority=99
redirect_stderr=false
stdout_logfile=/var/log/chromium.info
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
stdout_capture_maxbytes=1MB
stdout_events_enabled=false
stderr_logfile=/var/log/chromium.err
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=3
stderr_capture_maxbytes=1MB
stderr_events_enabled=false
environment=BREAKPAD_DUMP_LOCATION="/var/lib/chrome_storage/Crash Reports", CHROME_HEADLESS=1, GOOGLE_API_KEY="no", GOOGLE_DEFAULT_CLIENT_ID="no", GOOGLE_DEFAULT_CLIENT_SECRET="no", XDG_RUNTIME_DIR="/run/wayland/", XDG_CACHE_HOME="/var/cache"

[program:bluetoothd]
command=/bin/start-bluetoothd
priority=89
numprocs=1
autorestart=true
autostart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:swupdate]
command=/usr/bin/swupdate -l 3 -k /etc/nocturne.pem
numprocs=1
autorestart=true
autostart=true
startsecs=0
redirect_stderr=false
stdout_logfile=/var/log/swupdate.info
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
stdout_capture_maxbytes=1MB
stdout_events_enabled=false
stderr_logfile=/var/log/swupdate.err
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=3
stderr_capture_maxbytes=1MB
stderr_events_enabled=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

[include]
files = /etc/supervisor.d/*.conf
